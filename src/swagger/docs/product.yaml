paths:
  # 📦 PRODUCTS (MƏHSULLAR VƏ ADMİN ENDPOİNTLƏRİ)
  /product:
    get:
      summary: Bütün məhsulların siyahısı (Filtrlərlə)
      tags: [Products]
      parameters:
        - name: search
          in: query
          required: false
          description: "Ad (Az/Ru/En) və ya slug üzrə axtarış"
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: "Çeşidləmə növü"
          schema:
            type: string
            enum: [cheapToExpensive, expensiveToCheap, alphabetical]
        - name: priceUnder
          in: query
          required: false
          description: "Bu qiymətdən aşağı olanlar"
          schema:
            type: number
        - name: priceOver
          in: query
          required: false
          description: "Bu qiymətdən yuxarı olanlar"
          schema:
            type: number
        - name: minPrice
          in: query
          required: false
          description: "Minimum qiymət"
          schema:
            type: number
        - name: maxPrice
          in: query
          required: false
          description: "Maksimum qiymət"
          schema:
            type: number
        - name: stockUnder
          in: query
          required: false
          description: "Bu stok miqdarından aşağı olanlar"
          schema:
            type: integer
        - name: stockOver
          in: query
          required: false
          description: "Bu stok miqdarından yuxarı olanlar"
          schema:
            type: integer
        - name: minStock
          in: query
          required: false
          description: "Minimum stok sayı"
          schema:
            type: integer
        - name: maxStock
          in: query
          required: false
          description: "Maksimum stok sayı"
          schema:
            type: integer
        - name: ratingUnder
          in: query
          required: false
          description: "Bu reytinqdən aşağı olanlar"
          schema:
            type: number
        - name: ratingOver
          in: query
          required: false
          description: "Bu reytinqdən yuxarı olanlar"
          schema:
            type: number
        - name: minRating
          in: query
          required: false
          description: "Minimum reytinq"
          schema:
            type: number
        - name: maxRating
          in: query
          required: false
          description: "Maksimum reytinq"
          schema:
            type: number
      responses:
        200:
          description: Məhsullar filtrlərə uyğun gətirildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        500:
          description: Server xətası

    post:
      summary: Yeni məhsul yaradır (Admin)
      tags: [Products]
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        200:
          description: Məhsul uğurla yaradıldı
        400:
          description: Validate error (Joi xətası)
        500:
          description: Server xətası

  /products/{id}:
    get:
      summary: ID-yə görə tək məhsul məlumatı
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Məhsul tapıldı
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        404:
          description: Product not found

    put:
      summary: Mövcud məhsulu redaktə edir (Admin)
      tags: [Products]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        200:
          description: Product updated
        400:
          description: Validate error
        404:
          description: Product not found
        500:
          description: Server xətası

    delete:
      summary: Məhsulu silir (Admin)
      tags: [Products]
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Product deleted
        404:
          description: Product not found
        500:
          description: Server xətası

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        titleAz:
          type: string
        titleRu:
          type: string
        titleEn:
          type: string
        descriptionAz:
          type: string
          nullable: true
        descriptionEn:
          type: string
          nullable: true
        descriptionRu:
          type: string
          nullable: true
        price:
          type: integer
        discountPrice:
          type: integer
          nullable: true
        categoryId:
          type: integer
        brandId:
          type: integer
        stock:
          type: integer
        installmentPrice:
          type: integer
        isAction:
          type: boolean
        actionTextAz:
          type: string
          nullable: true
        actionTextRu:
          type: string
          nullable: true
        actionTextEn:
          type: string
          nullable: true
        rating:
          type: number
        reviewCount:
          type: integer

    ProductInput:
      type: object
      required: [slug, titleAz, titleRu, titleEn, price, categoryId, brandId, stock, installmentPrice]
      properties:
        slug:
          type: string
          example: "iphone-15-pro"
        titleAz:
          type: string
          example: "iPhone 15 Pro"
        titleRu:
          type: string
          example: "iPhone 15 Pro Ru"
        titleEn:
          type: string
          example: "iPhone 15 Pro En"
        descriptionAz:
          type: string
          example: "Əla vəziyyətdə"
        descriptionEn:
          type: string
          example: "In great condition"
        descriptionRu:
          type: string
          example: "В отличном состоянии"
        price:
          type: integer
          example: 2500
        discountPrice:
          type: integer
          example: 2400
        categoryId:
          type: integer
          example: 1
        brandId:
          type: integer
          example: 2
        stock:
          type: integer
          example: 15
        installmentPrice:
          type: integer
          example: 210
        isAction:
          type: boolean
          example: false
        actionTextAz:
          type: string
          nullable: true
        actionTextRu:
          type: string
          nullable: true
        actionTextEn:
          type: string
          nullable: true