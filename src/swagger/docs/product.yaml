

paths:
  /product:
    get:
      summary: Bütün məhsulların siyahısı (filtr, axtarış, pagination ilə)
      tags: [Products]
      security: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Ad (Az/Ru/En) və ya slug üzrə axtarış
        - name: sort
          in: query
          schema:
            type: string
            enum: [cheapToExpensive, expensiveToCheap, alphabetical]
        - name: page
          in: query
          schema: { type: integer, example: 1 }
        - name: limit
          in: query
          schema: { type: integer, example: 12 }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: brandId
          in: query
          schema: { type: integer }
        - name: color
          in: query
          schema: { type: string, example: "qara" }
        - name: priceUnder
          in: query
          schema: { type: number }
        - name: priceOver
          in: query
          schema: { type: number }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: stockUnder
          in: query
          schema: { type: integer }
        - name: stockOver
          in: query
          schema: { type: integer }
        - name: minStock
          in: query
          schema: { type: integer }
        - name: maxStock
          in: query
          schema: { type: integer }
      responses:
        200:
          description: Məhsullar tapıldı
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount: { type: integer }
                  totalPages: { type: integer }
                  currentPage: { type: integer }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        500:
          description: Server xətası
 
    post:
      summary: Yeni məhsul yaradır (Admin, slug titleAz-dan avtomatik yaranır)
      tags: [Products]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        201:
          description: Məhsul yaradıldı
        400:
          description: Validasiya xətası / coverImage göndərilməyib
        403:
          description: Yalnız admin
 
  /product/{id}:
    get:
      summary: Tək məhsul (id VƏ YA slug ilə axtarır)
      tags: [Products]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: "Rəqəm olarsa id kimi, mətn olarsa slug kimi axtarılır (məs. 5 və ya iphone-15-pro)"
      responses:
        200:
          description: Məhsul tapıldı
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        404:
          description: Product not found
 
    put:
      summary: Məhsulu redaktə edir (Admin) - yalnız dəyişmək istədiyiniz sahələri göndərin
      tags: [Products]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: "Rəqəm (id) və ya slug ola bilər"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        200:
          description: Product updated
        400:
          description: Validasiya xətası
        404:
          description: Product not found
        403:
          description: Yalnız admin
 
    delete:
      summary: Məhsulu silir, şəkilləri də diskdən silir (Admin)
      tags: [Products]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: "Rəqəm (id) və ya slug ola bilər"
      responses:
        200:
          description: Product deleted
        404:
          description: Product not found
        403:
          description: Yalnız admin
 
components:
  schemas:
    Product:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        coverImage: { type: string }
        images:
          type: array
          items: { type: string }
        titleAz: { type: string }
        titleRu: { type: string }
        titleEn: { type: string }
        descriptionAz: { type: string, nullable: true }
        descriptionRu: { type: string, nullable: true }
        descriptionEn: { type: string, nullable: true }
        price: { type: integer }
        discountPrice: { type: integer, nullable: true }
        categoryId: { type: integer }
        brandId: { type: integer }
        stock: { type: integer }
        color: { type: string, nullable: true }
        installmentMonths:
          type: array
          items: { type: integer }
        installmentOptions:
          type: array
          description: "Hər ay seçimi üçün avtomatik hesablanmış aylıq ödəniş (price/months)"
          items:
            type: object
            properties:
              months: { type: integer }
              monthlyPrice: { type: integer }
        isAction: { type: boolean }
        actionTextAz: { type: string, nullable: true }
        actionTextRu: { type: string, nullable: true }
        actionTextEn: { type: string, nullable: true }
 
    ProductInput:
      type: object
      required: [price, categoryId, brandId, stock, installmentMonths]
      properties:
        coverImage:
          type: string
          format: binary
          description: Örtük şəkli (yaratmaq üçün mütləqdir)
        images:
          type: array
          items:
            type: string
            format: binary
          description: Əlavə şəkillər (maks 5 ədəd)
        titleAz: { type: string, example: "Ağıllı Telefon" }
        titleRu: { type: string, example: "Смартфон" }
        titleEn: { type: string, example: "Smartphone" }
        descriptionAz: { type: string }
        descriptionRu: { type: string }
        descriptionEn: { type: string }
        price: { type: integer, example: 2500 }
        discountPrice: { type: integer, example: 2400 }
        categoryId: { type: integer, example: 1 }
        brandId: { type: integer, example: 1 }
        stock: { type: integer, example: 15 }
        color: { type: string, example: "qara" }
        installmentMonths:
          type: array
          items: { type: integer }
          example: [3, 6, 12]
        isAction: { type: boolean, example: false }
        actionTextAz: { type: string }
        actionTextRu: { type: string }
        actionTextEn: { type: string }