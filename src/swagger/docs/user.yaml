paths:
  /user/me:
    get:
      summary: Öz profilini görmək (statistika ilə birlikdə)
      tags: [ User ]
      security:
      - BearerAuth: []
      responses:
        200:
          description: Profil tapıldı
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/User'
                    - type: object
                      properties:
                        stats:
                          type: object
                          properties:
                            totalOrders: { type: integer }
                            totalSpent: { type: integer }
                            favoritesCount: { type: integer }
                            basketItemsCount: { type: integer }
        404:
          description: User not found

    put:
      summary: Profil məlumatlarını redaktə etmək (ad, telefon, email)
      tags: [ User ]
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullname: { type: string, example: "Turan Məmmədov" }
                phone: { type: string, example: "0501234567" }
                email: { type: string, example: "turan@gmail.com" }
      responses:
        200:
          description: Profile updated
        400:
          description: Email artıq istifadə olunur / Google hesabının email-i dəyişdirilə bilməz
        404:
          description: User not found

  /user/change-password:
    put:
      summary: Şifrəni dəyişmək (köhnə şifrə yoxlanılır)
      tags: [ User ]
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ currentPassword, newPassword ]
              properties:
                currentPassword: { type: string, example: "koneSifre123" }
                newPassword: { type: string, example: "yeniSifre123" }
      responses:
        200:
          description: Şifrə dəyişdirildi
        400:
          description: Hazırkı şifrə yanlışdır / Google hesabının şifrəsi yoxdur

  /user/image:
    post:
      summary: Profil şəkli yükləmək (köhnəsi avtomatik silinir)
      tags: [ User ]
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ image ]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        200:
          description: Profil şəkli yükləndi
        400:
          description: Şəkil göndərilməyib

    delete:
      summary: Profil şəklini silmək
      tags: [ User ]
      security:
      - BearerAuth: []
      responses:
        200:
          description: Profil şəkli silindi
        404:
          description: Profil şəkliniz yoxdur

  /user:
    get:
      summary: Bütün istifadəçilərin siyahısı (Admin)
      tags: [ User ]
      security:
      - BearerAuth: []
      responses:
        200:
          description: İstifadəçilər tapıldı
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        403:
          description: Yalnız admin

  /user/{id}:
    get:
      summary: Tək istifadəçi (Admin)
      tags: [ User ]
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
      responses:
        200:
          description: İstifadəçi tapıldı
        403:
          description: Yalnız admin
        404:
          description: User not found

    put:
      summary: İstənilən istifadəçini redaktə edir (Admin - rolu da dəyişə bilər)
      tags: [ User ]
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullname: { type: string }
                email: { type: string }
                phone: { type: string }
                role: { type: string, enum: [ user, admin ] }
      responses:
        200:
          description: User updated
        403:
          description: Yalnız admin
        404:
          description: User not found

    delete:
      summary: İstifadəçini silir (Admin)
      tags: [ User ]
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
      responses:
        200:
          description: User deleted
        403:
          description: Yalnız admin
        404:
          description: User not found

components:
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        fullname: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [ user, admin ] }
        registerMethod: { type: string, enum: [ form, googleAuth ] }
        bonusPoints: { type: integer }
        image: { type: string, nullable: true }
